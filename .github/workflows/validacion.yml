name: Validacion del proyecto
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4
      - name: Verificar estructura
        run: |
          test -f README.md
          test -d src
          test -d tests
          echo "Estructura validada correctamente"
